[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-coach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
